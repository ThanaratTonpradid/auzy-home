<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auzy — Smart home hub</title>
    <meta
      name="description"
      content="Register ESP32, NodeMCU, and Arduino devices and ingest their sensor data."
    />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("auzy-theme");
          const theme =
            stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          const tones = ["mint", "azure", "ember", "ocean", "slate"];
          const toneStored = localStorage.getItem("auzy-tone");
          const tone = tones.includes(toneStored) ? toneStored : "mint";
          const dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.dataset.tone = tone;
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
          document.documentElement.dataset.tone = "mint";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Syne:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
